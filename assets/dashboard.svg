<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-label="Estatísticas do GitHub e distribuição de linguagens de Robson Soares">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <style><![CDATA[
    text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .bg{fill:#0b1026}.ttl{fill:#c4b5fd}.lb{fill:#e2e8f0}.mu{fill:#94a3b8}.rg{stroke:#1e1b3a}.track{fill:#1e1b3a}.big{fill:#34d399}
    .v1{fill:#facc15}.v2{fill:#34d399}.v3{fill:#a78bfa}.v4{fill:#38bdf8}.v5{fill:#fb923c}
    @media (prefers-color-scheme: light){
      .bg{fill:#f8fafc}.ttl{fill:#5b21b6}.lb{fill:#1e293b}.mu{fill:#475569}.rg{stroke:#e2e8f0}.track{fill:#e2e8f0}.big{fill:#059669}
      .v1{fill:#a16207}.v2{fill:#047857}.v3{fill:#6d28d9}.v4{fill:#0369a1}.v5{fill:#c2410c}
    }
    .fade{opacity:0;animation:fade .6s ease forwards}
    @keyframes fade{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}}
  ]]></style>

  <rect class="bg" x="1" y="1" width="488" height="208" rx="6" stroke="url(#edge)" stroke-width="2"/>
  <text class="ttl" x="26" y="38" font-size="16" font-weight="700">⚡ Estatísticas de Robson Soares</text>
  <g font-size="13">
    <text class="lb" x="26" y="76">⭐ Repositórios públicos:</text><text class="v2" x="300" y="76" text-anchor="end" font-weight="700">1</text>
    <text class="lb" x="26" y="104">🔒 Repositórios privados:</text><text class="v3" x="300" y="104" text-anchor="end" font-weight="700">3</text>
    <text class="lb" x="26" y="132">📦 Repositórios no total:</text><text class="v4" x="300" y="132" text-anchor="end" font-weight="700">4</text>
    <text class="lb" x="26" y="160">🚀 Projetos em destaque:</text><text class="v2" x="300" y="160" text-anchor="end" font-weight="700">3</text>
    <text class="lb" x="26" y="188">📅 No GitHub desde:</text><text class="v1" x="300" y="188" text-anchor="end" font-weight="700">2023</text>
  </g>
  <g transform="translate(400 106)">
    <circle class="rg" r="46" fill="none" stroke-width="4"/>
    <circle r="46" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" stroke-dasharray="230 60" transform="rotate(-90)">
      <animateTransform attributeName="transform" type="rotate" from="-90" to="270" dur="14s" repeatCount="indefinite"/>
    </circle>
    <clipPath id="av"><circle r="37"/></clipPath>
    <image href="data:image/jpeg;base64," x="-37" y="-37" width="74" height="74" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/>
    <text class="mu" y="72" text-anchor="middle" font-size="9">FULL STACK</text>
  </g>

  <rect class="bg" x="501" y="1" width="358" height="208" rx="6" stroke="url(#edge)" stroke-width="2"/>
  <text class="ttl" x="522" y="36" font-size="14" font-weight="700">📊 Linguagens por volume de código</text>
  <!-- LANGUAGE_ROWS_START -->
  <circle cx="526" cy="68" r="4" fill="#f59e0b"/><text class="lb" x="538" y="72" font-size="10.5">TypeScript</text><rect class="track" x="680" y="65" width="120" height="6" rx="3"/><rect x="680" y="65" width="93.69" height="6" rx="3" fill="#f59e0b"/><text x="838" y="72" text-anchor="end" font-size="10.5" font-weight="700" fill="#f59e0b">78%</text>
  <circle cx="526" cy="92" r="4" fill="#38bdf8"/><text class="lb" x="538" y="96" font-size="10.5">Java</text><rect class="track" x="680" y="89" width="120" height="6" rx="3"/><rect x="680" y="89" width="19.44" height="6" rx="3" fill="#38bdf8"/><text x="838" y="96" text-anchor="end" font-size="10.5" font-weight="700" fill="#38bdf8">16%</text>
  <circle cx="526" cy="116" r="4" fill="#a78bfa"/><text class="lb" x="538" y="120" font-size="10.5">PLpgSQL</text><rect class="track" x="680" y="113" width="120" height="6" rx="3"/><rect x="680" y="113" width="2.60" height="6" rx="3" fill="#a78bfa"/><text x="838" y="120" text-anchor="end" font-size="10.5" font-weight="700" fill="#a78bfa">2%</text>
  <circle cx="526" cy="140" r="4" fill="#34d399"/><text class="lb" x="538" y="144" font-size="10.5">Docker</text><rect class="track" x="680" y="137" width="120" height="6" rx="3"/><rect x="680" y="137" width="0.03" height="6" rx="3" fill="#34d399"/><text x="838" y="144" text-anchor="end" font-size="10.5" font-weight="700" fill="#34d399">&lt;1%</text>
  <circle cx="526" cy="164" r="4" fill="#818cf8"/><text class="lb" x="538" y="168" font-size="10.5">Outras linguagens</text><rect class="track" x="680" y="161" width="120" height="6" rx="3"/><rect x="680" y="161" width="4.25" height="6" rx="3" fill="#818cf8"/><text x="838" y="168" text-anchor="end" font-size="10.5" font-weight="700" fill="#818cf8">4%</text>
  <!-- LANGUAGE_ROWS_END -->
</svg>
