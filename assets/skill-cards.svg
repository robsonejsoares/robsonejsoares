<svg xmlns="http://www.w3.org/2000/svg" width="860" height="112" viewBox="0 0 860 112" role="img" aria-label="Principais áreas: Front-end, Back-end, Mobile, Bancos de dados, DevOps e Segurança">
  <style><![CDATA[
    text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .bg{fill:#0b1026}.lb{fill:#f1f5f9}.mu{fill:#94a3b8}
    @media (prefers-color-scheme: light){.bg{fill:#f8fafc}.lb{fill:#0f172a}.mu{fill:#475569}}
    .c{animation:up .6s ease both}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.c{animation:none}}
  ]]></style>
  <g class="c"><rect class="bg" x="1" y="1" width="136" height="110" rx="6" stroke="#38bdf8" stroke-width="1"/><text x="68" y="38" text-anchor="middle" font-size="22">⚛️</text><text class="lb" x="68" y="62" text-anchor="middle" font-size="11" font-weight="700">Front-end</text><text class="mu" x="68" y="78" text-anchor="middle" font-size="9">React • Angular • Vue.js</text><rect x="16" y="92" width="106" height="4" rx="2" fill="#38bdf8"/></g>
  <g class="c" style="animation-delay:.1s"><rect class="bg" x="145" y="1" width="136" height="110" rx="6" stroke="#f59e0b" stroke-width="1"/><text x="213" y="38" text-anchor="middle" font-size="22">⚙️</text><text class="lb" x="213" y="62" text-anchor="middle" font-size="11" font-weight="700">Back-end</text><text class="mu" x="213" y="78" text-anchor="middle" font-size="9">Java • Node.js • PHP</text><rect x="160" y="92" width="106" height="4" rx="2" fill="#f59e0b"/></g>
  <g class="c" style="animation-delay:.2s"><rect class="bg" x="289" y="1" width="136" height="110" rx="6" stroke="#4ade80" stroke-width="1"/><text x="357" y="38" text-anchor="middle" font-size="22">📱</text><text class="lb" x="357" y="62" text-anchor="middle" font-size="11" font-weight="700">Mobile</text><text class="mu" x="357" y="78" text-anchor="middle" font-size="9">React Native</text><rect x="304" y="92" width="106" height="4" rx="2" fill="#4ade80"/></g>
  <g class="c" style="animation-delay:.3s"><rect class="bg" x="433" y="1" width="136" height="110" rx="6" stroke="#a78bfa" stroke-width="1"/><text x="501" y="38" text-anchor="middle" font-size="22">🗄️</text><text class="lb" x="501" y="62" text-anchor="middle" font-size="11" font-weight="700">Bancos de dados</text><text class="mu" x="501" y="78" text-anchor="middle" font-size="9">SQL • NoSQL</text><rect x="448" y="92" width="106" height="4" rx="2" fill="#a78bfa"/></g>
  <g class="c" style="animation-delay:.4s"><rect class="bg" x="577" y="1" width="136" height="110" rx="6" stroke="#818cf8" stroke-width="1"/><text x="645" y="38" text-anchor="middle" font-size="22">🧰</text><text class="lb" x="645" y="62" text-anchor="middle" font-size="11" font-weight="700">DevOps</text><text class="mu" x="645" y="78" text-anchor="middle" font-size="9">Docker • Git • Flyway</text><rect x="592" y="92" width="106" height="4" rx="2" fill="#818cf8"/></g>
  <g class="c" style="animation-delay:.5s"><rect class="bg" x="721" y="1" width="138" height="110" rx="6" stroke="#fb7185" stroke-width="1"/><text x="790" y="38" text-anchor="middle" font-size="22">🔐</text><text class="lb" x="790" y="62" text-anchor="middle" font-size="11" font-weight="700">Segurança</text><text class="mu" x="790" y="78" text-anchor="middle" font-size="9">JWT • MFA</text><rect x="736" y="92" width="108" height="4" rx="2" fill="#fb7185"/></g>
