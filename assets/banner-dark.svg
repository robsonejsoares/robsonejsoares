    <style><![CDATA[text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.intro{opacity:0;animation:fadeUp .55s ease forwards}.cursor{animation:blink 1s step-end infinite}.float{animation:float 5s ease-in-out infinite}.float2{animation:float2 6.2s ease-in-out infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.shine{animation:shine 6s ease-in-out 2.5s infinite}.scan{animation:scan 7s ease-in-out infinite}.role{opacity:0}.r1{animation:r1 16s ease infinite}.r2{animation:r2 16s ease infinite}.r3{animation:r3 16s ease infinite}.r4{animation:r4 16s ease infinite}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes float2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes shine{0%{transform:translateX(-180px) skewX(-15deg)}55%,100%{transform:translateX(1380px) skewX(-15deg)}}@keyframes scan{0%,100%{transform:translateY(-8px);opacity:0}15%,72%{opacity:.3}78%{transform:translateY(150px);opacity:0}}@keyframes r1{0%,20%{opacity:1}24%,100%{opacity:0}}@keyframes r2{0%,24%{opacity:0}26%,45%{opacity:1}49%,100%{opacity:0}}@keyframes r3{0%,49%{opacity:0}51%,70%{opacity:1}74%,100%{opacity:0}}@keyframes r4{0%,74%{opacity:0}76%,96%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.intro,.cursor,.float,.float2,.pulse,.shine,.scan,.role{animation:none!important;opacity:1}.r2,.r3,.r4{display:none}}]]></style>
