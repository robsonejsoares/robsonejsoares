    <g class="intro" style="animation-delay:1s"><rect x="48" y="270" width="570" height="74" rx="6" fill="#111827" fill-opacity=".9" stroke="#8b5cf6" stroke-opacity=".45"/><rect x="48" y="270" width="4" height="74" rx="2" fill="url(#edge)"/><text class="mono" x="76" y="299" fill="#e2e8f0" font-size="14">Soluções confiáveis começam com decisões claras.</text><text class="mono" x="76" y="325" fill="#94a3b8" font-size="14">Do banco de dados à interface, cada camada importa.</text></g>

