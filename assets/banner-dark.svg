    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0ea5e9"/><stop offset=".45" stop-color="#8b5cf6"/><stop offset=".72" stop-color="#c084fc"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
