<svg xmlns="http://www.w3.org/2000/svg" width="420" height="185" viewBox="0 0 420 185" role="img" aria-label="Estatísticas públicas do GitHub de Robson Soares">
  <style>
    .bg{fill:#0b1026;stroke:#4c1d95}
    .t{fill:#c4b5fd}.n{fill:#ffffff}.l{fill:#94a3b8}
    @media (prefers-color-scheme: light){.bg{fill:#f5f3ff;stroke:#c4b5fd}.t{fill:#5b21b6}.n{fill:#1e1b4b}.l{fill:#475569}}
  </style>
  <rect class="bg" x="1" y="1" width="418" height="183" rx="6"/>
  <text class="t" x="24" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Estatísticas públicas do GitHub</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text class="n" x="24" y="95" font-size="38" font-weight="700">1</text>
    <text class="l" x="24" y="118" font-size="13">repositório público</text>
    <text class="n" x="170" y="95" font-size="38" font-weight="700">1</text>
    <text class="l" x="170" y="118" font-size="13">seguidor</text>
    <text class="n" x="300" y="95" font-size="38" font-weight="700">2023</text>
    <text class="l" x="300" y="118" font-size="13">no GitHub desde</text>
  </g>
  <text class="l" x="24" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="11">Dados públicos conferidos em 04/11/2026.</text>
