<svg xmlns="http://www.w3.org/2000/svg" width="420" height="185" viewBox="0 0 420 185" role="img" aria-label="Stack principal de Robson Soares">
  <style>
    .bg{fill:#0b1026;stroke:#4c1d95}
    .t{fill:#c4b5fd}.l{fill:#e2e8f0}.chip{fill:#1e1b4b;stroke:#6d4aff}
    @media (prefers-color-scheme: light){.bg{fill:#f5f3ff;stroke:#c4b5fd}.t{fill:#5b21b6}.l{fill:#1e1b4b}.chip{fill:#ede9fe;stroke:#a78bfa}}
  </style>
  <rect class="bg" x="1" y="1" width="418" height="183" rx="6"/>
  <text class="t" x="24" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Stack principal</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" class="l">
    <text class="t" x="24" y="68" font-size="11">BACK-END</text>
    <rect class="chip" x="24" y="74" width="56" height="22" rx="6"/><text x="52" y="89" text-anchor="middle">Java</text>
    <rect class="chip" x="88" y="74" width="56" height="22" rx="6"/><text x="116" y="89" text-anchor="middle">PHP</text>
    <rect class="chip" x="152" y="74" width="72" height="22" rx="6"/><text x="188" y="89" text-anchor="middle">Node.js</text>
    <text class="t" x="250" y="68" font-size="11">FRONT-END</text>
    <rect class="chip" x="250" y="74" width="62" height="22" rx="6"/><text x="281" y="89" text-anchor="middle">React</text>
    <rect class="chip" x="320" y="74" width="80" height="22" rx="6"/><text x="360" y="89" text-anchor="middle">TypeScript</text>
    <text class="t" x="24" y="118" font-size="11">BANCOS DE DADOS</text>
    <rect class="chip" x="24" y="124" width="84" height="22" rx="6"/><text x="66" y="139" text-anchor="middle">PostgreSQL</text>
    <rect class="chip" x="116" y="124" width="60" height="22" rx="6"/><text x="146" y="139" text-anchor="middle">Oracle</text>
    <rect class="chip" x="184" y="124" width="84" height="22" rx="6"/><text x="226" y="139" text-anchor="middle">SQL Server</text>
    <rect class="chip" x="276" y="124" width="56" height="22" rx="6"/><text x="304" y="139" text-anchor="middle">MySQL</text>
    <rect class="chip" x="340" y="124" width="64" height="22" rx="6"/><text x="372" y="139" text-anchor="middle">MongoDB</text>
  </g>
</svg>
